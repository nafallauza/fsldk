<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04160e"/>
      <stop offset="50%" stop-color="#082417"/>
      <stop offset="100%" stop-color="#03120b"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0a9346" stroke-width="1" stroke-opacity="0.09"/>
    </pattern>

    <!-- Diagonal Accent Stripe Pattern -->
    <pattern id="stripes" width="60" height="60" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="60" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#stripes)"/>

  <!-- Subtle Radial Glow in Center -->
  <circle cx="600" cy="370" r="320" fill="#0a9346" opacity="0.12" filter="blur(40px)"/>

  <!-- Viewfinder Frame Border -->
  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#0a9346" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="6 6" rx="12"/>

  <!-- Camera Viewfinder Corner Markers -->
  <!-- Top-Left -->
  <path d="M 50 90 L 50 50 L 90 50" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7"/>
  <!-- Top-Right -->
  <path d="M 1110 50 L 1150 50 L 1150 90" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7"/>
  <!-- Bottom-Left -->
  <path d="M 50 710 L 50 750 L 90 750" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7"/>
  <!-- Bottom-Right -->
  <path d="M 1110 750 L 1150 750 L 1150 710" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- Top Metadata Bar -->
  <g transform="translate(70, 75)">
    <rect width="140" height="28" rx="6" fill="#0a9346" fill-opacity="0.2" stroke="#34d399" stroke-opacity="0.4" stroke-width="1"/>
    <text x="70" y="18" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="1.5">TEMPLATE</text>
    <text x="160" y="18" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="500" fill="#a7f3d0" fill-opacity="0.6" letter-spacing="0.5">DOKUMENTASI FOTO UTAMA · 3:2 ASPECT RATIO</text>
  </g>

  <g transform="translate(1130, 75)">
    <text x="0" y="18" font-family="monospace" font-size="12" font-weight="600" fill="#34d399" text-anchor="end" opacity="0.7">1200 × 800 PX</text>
  </g>

  <!-- Center Card Content -->
  <!-- Camera / Photo Graphic Icon -->
  <g transform="translate(600, 320)">
    <!-- Outer Icon Container -->
    <rect x="-54" y="-54" width="108" height="108" rx="24" fill="#062316" stroke="#0a9346" stroke-width="2" stroke-opacity="0.5"/>
    <!-- Camera Body -->
    <path d="M -28 -10 C -28 -14, -25 -17, -21 -17 L -14 -17 L -11 -23 C -9 -26, -6 -28, -2 -28 L 6 -28 C 10 -28, 13 -26, 15 -23 L 18 -17 L 25 -17 C 29 -17, 32 -14, 32 -10 L 32 20 C 32 24, 29 27, 25 27 L -21 27 C -25 27, -28 24, -28 20 Z" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Camera Lens -->
    <circle cx="2" cy="5" r="13" fill="none" stroke="#34d399" stroke-width="2.5"/>
    <circle cx="2" cy="5" r="5" fill="#0a9346" fill-opacity="0.6"/>
    <!-- Flash dot -->
    <circle cx="22" cy="-9" r="2.5" fill="#34d399"/>
  </g>

  <!-- Center Typography -->
  <text x="600" y="425" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">
    Area Foto Dokumentasi Kegiatan
  </text>
  <text x="600" y="458" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#a7f3d0" text-anchor="middle" opacity="0.75">
    Slot Placeholder Siap Diganti dengan Foto Dokumentasi Resmi FSLDK Jogja
  </text>

  <!-- Bottom Helper Tag -->
  <g transform="translate(600, 500)">
    <rect x="-140" y="0" width="280" height="36" rx="18" fill="#041910" stroke="#0a9346" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="-115" cy="18" r="4" fill="#34d399"/>
    <text x="5" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ecfdf5" text-anchor="middle">
      Rekomendasi Foto Resolusi 3:2
    </text>
  </g>

  <!-- Center Crosshair Target -->
  <path d="M 600 240 L 600 250 M 600 550 L 600 560 M 460 370 L 470 370 M 730 370 L 740 370" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round"/>

  <!-- Bottom Brand Watermark -->
  <text x="70" y="735" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#0a9346" letter-spacing="1">
    PUSKOMDA FSLDK D.I. YOGYAKARTA
  </text>
  <text x="1130" y="735" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="#6ee7b7" text-anchor="end" opacity="0.5">
    ASSET TEMPLATE PLACEHOLDER
  </text>
</svg>
